name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DB_URL: sqlite:///ci.db
      MOCK_IAM: "true"
      LOCAL_ONLY: "true"
      ENABLE_GENAI: "false"
      DRY_RUN: "true"
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Run test suite
        run: python -m pytest -q

  postgres-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: iam_test
          POSTGRES_PASSWORD: iam_test
          POSTGRES_DB: iam_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U iam_test -d iam_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_TEST_URL: postgresql://iam_test:iam_test@localhost:5432/iam_test
      MOCK_IAM: "true"
      LOCAL_ONLY: "true"
      ENABLE_GENAI: "false"
      DRY_RUN: "true"
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Run Postgres migration and concurrency checks
        run: python -m pytest -q tests/test_migrations.py
